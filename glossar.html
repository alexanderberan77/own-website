<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systemic Glossary | Lernecke</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f293d;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .nav-back {
            max-width: 1400px;
            margin: 0 auto 1.5rem auto;
            width: 100%;
        }

        .nav-back a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-back a:hover {
            color: var(--accent-cyan);
        }

        .glossary-layout {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            flex-grow: 1;
        }

        @media (max-width: 900px) {
            .glossary-layout {
                grid-template-columns: 1fr;
            }
        }

        /* --- CONTROL WHEEL PANEL --- */
        .controls-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: fit-content;
        }

        .panel-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Dual-Wheel 1: Alphabet Selector */
        .letter-wheel {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .letter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .letter-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }

        .letter-btn.active {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
            font-weight: 700;
        }

        .letter-btn.disabled {
            opacity: 0.2;
            cursor: not-allowed;
            border-color: transparent;
        }

        /* Dual-Wheel 2: Terms Selector */
        .terms-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .term-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .term-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .term-btn.active {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* --- DISPLAY HUD PANEL --- */
        .hud-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
        }

        .hud-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .hud-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-amber);
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: block;
        }

        .hud-title {
            font-size: 2.2rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .hud-body {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .example-box {
            background: rgba(245, 158, 11, 0.05);
            border-left: 3px solid var(--accent-amber);
            padding: 1.25rem;
            border-radius: 0 8px 8px 0;
            margin-top: 1rem;
        }

        .example-box-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-amber);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .hud-footer {
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .tags-container, .cross-refs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .section-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

        .tag-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
        }

        .cross-ref-chip {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--accent-cyan);
            font-size: 0.8rem;
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cross-ref-chip:hover {
            background: var(--accent-cyan);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="nav-back">
        <a href="lernecke.html">&larr; Zurück zur Lernecke</a>
    </div>

    <div class="glossary-layout">
        <!-- LINKES PANEL: DUAL-WHEEL -->
        <aside class="controls-panel">
            <div>
                <span class="panel-title">1. Index (A-Z)</span>
                <div class="letter-wheel" id="letterWheel" style="margin-top: 0.75rem;"></div>
            </div>

            <div>
                <span class="panel-title">2. Begriffe</span>
                <div class="terms-list" id="termsList" style="margin-top: 0.75rem;"></div>
            </div>
        </aside>

        <!-- RECHTES PANEL: HUD DISPLAY -->
        <main class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <span class="hud-category" id="hudCategory">Kategorie</span>
                <h1 class="hud-title" id="hudTitle">Begriff wählen</h1>
            </div>

            <div class="hud-body" id="hudDefinition">
                Wähle links einen Buchstaben und einen Begriff aus, um die Details anzuzeigen.
            </div>

            <div class="example-box" id="hudExampleBox" style="display: none;">
                <div class="example-box-title">[ CASE STUDY / BEISPIEL ]</div>
                <div id="hudExample"></div>
            </div>

            <div class="hud-footer">
                <div class="tags-container" id="hudTagsContainer">
                    <span class="section-label">Tags:</span>
                    <div id="hudTags"></div>
                </div>

                <div class="cross-refs-container" id="hudCrossRefsContainer">
                    <span class="section-label">Querverweise:</span>
                    <div id="hudCrossRefs"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- DATEN-IMPORT -->
    <script src="data/glossar-data.js"></script>

    <script>
        let currentLetter = '';
        let currentTermId = '';

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        const letterWheel = document.getElementById('letterWheel');
        const termsList = document.getElementById('termsList');

        // Init App
        function initGlossary() {
            if (typeof glossaryData === 'undefined' || !glossaryData.length) {
                document.getElementById('hudDefinition').innerText = "Keine Glossar-Daten gefunden. Bitte führe das Python-Skript aus.";
                return;
            }

            renderLetterWheel();
            
            // Auto-select first available letter
            const firstAvailable = alphabet.find(l => glossaryData.some(item => item.letter === l));
            if (firstAvailable) {
                selectLetter(firstAvailable);
            }
        }

        // Render Buchstaben-Rad
        function renderLetterWheel() {
            letterWheel.innerHTML = '';
            alphabet.forEach(letter => {
                const hasTerms = glossaryData.some(item => item.letter === letter);
                const btn = document.createElement('button');
                btn.className = `letter-btn ${hasTerms ? '' : 'disabled'}`;
                btn.innerText = letter;
                
                if (hasTerms) {
                    btn.onclick = () => selectLetter(letter);
                }
                btn.id = `letter-btn-${letter}`;
                letterWheel.appendChild(btn);
            });
        }

        // Buchstabe auswählen
        function selectLetter(letter) {
            currentLetter = letter;

            document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`letter-btn-${letter}`);
            if (activeBtn) activeBtn.classList.add('active');

            const filteredTerms = glossaryData.filter(item => item.letter === letter);
            renderTermsList(filteredTerms);

            if (filteredTerms.length > 0) {
                selectTerm(filteredTerms[0].id);
            }
        }

        // Begriff-Liste rendern
        function renderTermsList(terms) {
            termsList.innerHTML = '';
            terms.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'term-btn';
                btn.innerText = item.term;
                btn.id = `term-btn-${item.id}`;
                btn.onclick = () => selectTerm(item.id);
                termsList.appendChild(btn);
            });
        }

        // Begriff auswählen und HUD füllen
        function selectTerm(termId) {
            currentTermId = termId;

            document.querySelectorAll('.term-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`term-btn-${termId}`);
            if (activeBtn) activeBtn.classList.add('active');

            const item = glossaryData.find(g => g.id === termId);
            if (!item) return;

            // Update HUD Header & Content
            document.getElementById('hudCategory').innerText = item.categories.join(' / ');
            document.getElementById('hudTitle').innerText = item.term;
            document.getElementById('hudDefinition').innerText = item.definition;

            // Example Box
            const exampleBox = document.getElementById('hudExampleBox');
            if (item.example) {
                document.getElementById('hudExample').innerText = item.example;
                exampleBox.style.display = 'block';
            } else {
                exampleBox.style.display = 'none';
            }

            // Tags
            const tagsContainer = document.getElementById('hudTags');
            tagsContainer.innerHTML = item.tags.map(t => `<span class="tag-chip">${t}</span>`).join('');

            // Cross References (Interaktiv!)
            const crossRefsContainer = document.getElementById('hudCrossRefs');
            crossRefsContainer.innerHTML = '';
            
            if (item.cross_references && item.cross_references.length > 0) {
                item.cross_references.forEach(refName => {
                    const targetItem = glossaryData.find(g => g.term.toLowerCase() === refName.toLowerCase() || g.term.toLowerCase().includes(refName.toLowerCase()));
                    
                    const chip = document.createElement('span');
                    chip.className = 'cross-ref-chip';
                    chip.innerText = refName;

                    if (targetItem) {
                        chip.onclick = () => {
                            selectLetter(targetItem.letter);
                            selectTerm(targetItem.id);
                        };
                    }
                    crossRefsContainer.appendChild(chip);
                });
            } else {
                crossRefsContainer.innerHTML = '<span style="color: var(--text-secondary); font-size: 0.8rem;">Keine</span>';
            }
        }

        // Start
        window.onload = initGlossary;
    </script>
</body>
</html>
