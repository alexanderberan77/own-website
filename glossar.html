<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Command Grid: Cyber-Glossar | Alexander Beran</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: rgba(15, 15, 20, 0.9);
      --text-main: #e0e0e0;
      --text-muted: #666677;
      --cyber-glow: #00ffcc;
      --cyber-alert: #ffb703;
      --font-mono: 'JetBrains Mono', monospace;
      --border-color: #2a2a30;
      --item-height: 42px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 1.5rem 5%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      opacity: 0.12;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 3rem);
    }

    .nav-bar {
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      color: var(--cyber-glow);
      text-decoration: none;
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      background: rgba(0, 255, 204, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.3);
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: rgba(0, 255, 204, 0.15);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.8rem;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--cyber-glow);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      outline: none;
      width: 180px;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .top-filter-bar {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-color);
    }

    .category-pills, .quick-az-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .pill-btn, .az-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn:hover, .pill-btn.active,
    .az-btn:hover, .az-btn.active {
      color: var(--cyber-glow);
      border-color: var(--cyber-glow);
      background: rgba(0, 255, 204, 0.1);
    }

    .az-btn.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: transparent;
    }

    .glossary-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      flex-grow: 1;
      min-height: 0;
    }

    @media (max-width: 900px) {
      .glossary-grid { grid-template-columns: 1fr; height: auto; }
      .wrapper { height: auto; }
    }

    /* WHEELS PANEL */
    .wheels-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      position: relative;
      padding: 0 0.5rem;
      display: flex;
      gap: 0.5rem;
      overflow: hidden;
      backdrop-filter: blur(5px);
      height: 100%;
      touch-action: none; /* Blockiert Browser-Pull-Gesten komplett auf den Rädern */
    }

    .wheels-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 8px; height: 8px;
      border-top: 2px solid var(--cyber-glow);
      border-left: 2px solid var(--cyber-glow);
    }

    .wheel-column {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .wheel-column.letters { flex: 0.35; border-right: 1px dashed var(--border-color); }
    .wheel-column.terms { flex: 0.65; }

    /* PERFECT CENTER BEAM ALIGNMENT */
    .wheel-beam {
      position: absolute;
      top: calc(50% - (var(--item-height) / 2));
      left: 0;
      width: 100%;
      height: var(--item-height);
      background: rgba(0, 255, 204, 0.08);
      border-top: 1px solid var(--cyber-glow);
      border-bottom: 1px solid var(--cyber-glow);
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
    }

    .wheel-track {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    .wheel-item {
      height: var(--item-height);
      line-height: var(--item-height);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 0.5rem;
      transition: all 0.15s ease;
    }

    .wheel-item.selected {
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 8px var(--cyber-glow);
    }

    /* HUD DISPLAY */
    .hud-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 2rem;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      backdrop-filter: blur(5px);
    }

    .hud-panel::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 8px; height: 8px;
      border-top: 2px solid var(--cyber-glow);
      border-right: 2px solid var(--cyber-glow);
    }

    .hud-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.2rem;
    }

    .hud-category {
      font-size: 0.7rem;
      color: var(--cyber-alert);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      display: block;
    }

    .hud-title {
      font-size: 1.8rem;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .hud-body {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }

    .example-box {
      background: rgba(255, 183, 3, 0.04);
      border-left: 3px solid var(--cyber-alert);
      padding: 1rem;
      margin-top: 1rem;
    }

    .example-box-title {
      font-size: 0.65rem;
      color: var(--cyber-alert);
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
      font-weight: bold;
    }

    .example-box-content { font-size: 0.85rem; color: #d0d0d0; }

    .hud-footer {
      border-top: 1px dashed var(--border-color);
      padding-top: 1rem;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .meta-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .meta-label { font-size: 0.7rem; color: var(--text-muted); }
    .tag-badge { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.7rem; padding: 0.15rem 0.5rem; }

    .cross-ref-btn {
      background: rgba(0, 255, 204, 0.08);
      border: 1px solid rgba(0, 255, 204, 0.3);
      color: var(--cyber-glow);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 0.2rem 0.6rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cross-ref-btn:hover { background: var(--cyber-glow); color: #000; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
  </style>
</head>
<body>

  <canvas id="matrix-canvas"></canvas>

  <div class="wrapper">
    <div class="nav-bar">
      <a href="lernecke.html" class="btn-back">&lt; // RETURN_TO_LEARNHUB</a>
      
      <div class="search-box">
        <span style="color: var(--text-muted); font-size: 0.8rem; margin-right: 0.4rem;">&gt;</span>
        <input type="text" id="searchInput" placeholder="SEARCH_DATABASE..." autocomplete="off">
      </div>
    </div>

    <div class="top-filter-bar">
      <div class="category-pills" id="categoryPills"></div>
      <div class="quick-az-bar" id="quickAzBar"></div>
    </div>

    <div class="glossary-grid">
      <aside class="wheels-panel">
        <div class="wheel-beam"></div>

        <div class="wheel-column letters" id="letterWheelCol">
          <div class="wheel-track" id="letterTrack"></div>
        </div>

        <div class="wheel-column terms" id="termWheelCol">
          <div class="wheel-track" id="termTrack"></div>
        </div>
      </aside>

      <main class="hud-panel" id="hudPanel">
        <div>
          <div class="hud-header">
            <span class="hud-category" id="hudCategory">CATEGORIES</span>
            <h1 class="hud-title" id="hudTitle">SELECT_TERM</h1>
          </div>

          <div class="hud-body" id="hudDefinition">
            Verwende die Cyber-Räder auf der linken Seite oder die Filterleiste oben.
          </div>

          <div class="example-box" id="hudExampleBox" style="display: none;">
            <div class="example-box-title">[ CASE STUDY / BEISPIEL ]</div>
            <div class="example-box-content" id="hudExample"></div>
          </div>
        </div>

        <div class="hud-footer">
          <div class="meta-row">
            <span class="meta-label">TAGS:</span>
            <div id="hudTags"></div>
          </div>

          <div class="meta-row">
            <span class="meta-label">CROSS_REFS:</span>
            <div id="hudCrossRefs"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="data/glossar-data.js"></script>

  <script>
    /* MATRIX CANVAS */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789<>{}[]/*+=~#$_';
    const fontSize = 14;
    let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(10, 10, 12, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ffcc';
      ctx.font = fontSize + 'px "JetBrains Mono", monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    /* GLOSSARY ENGINE */
    const itemHeight = 42;
    const alphabet = ["#", ... "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];

    let currentCategory = 'ALL';
    let availableLetters = [];
    let currentLetterIdx = 0;
    let filteredTerms = [];
    let currentTermIdx = 0;

    const letterTrack = document.getElementById('letterTrack');
    const termTrack = document.getElementById('termTrack');
    const categoryPills = document.getElementById('categoryPills');
    const quickAzBar = document.getElementById('quickAzBar');
    const searchInput = document.getElementById('searchInput');

    function initGlossaryEngine() {
      if (typeof glossaryData === 'undefined' || !glossaryData.length) {
        document.getElementById('hudDefinition').innerText = "ERROR: Keine Glossar-Daten gefunden.";
        return;
      }

      buildCategoryFilter();
      applyFilters();
      setupWheelEvents();
    }

    function buildCategoryFilter() {
      const categories = new Set();
      glossaryData.forEach(item => {
        item.categories.forEach(cat => categories.add(cat.split('/')[0].trim()));
      });

      categoryPills.innerHTML = `<button class="pill-btn active" data-cat="ALL" onclick="setCategory('ALL')">[ ALL ]</button>`;
      categories.forEach(cat => {
        categoryPills.innerHTML += `<button class="pill-btn" data-cat="${cat}" onclick="setCategory('${cat}')">[ ${cat.toUpperCase()} ]</button>`;
      });
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-cat') === cat);
      });
      applyFilters(searchInput.value);
    }

    function applyFilters(searchTerm = '') {
      let data = glossaryData;

      if (currentCategory !== 'ALL') {
        data = data.filter(item => item.categories.some(c => c.startsWith(currentCategory)));
      }

      if (searchTerm.trim() !== '') {
        const termLower = searchTerm.toLowerCase();
        data = data.filter(item => 
          item.term.toLowerCase().includes(termLower) ||
          item.definition.toLowerCase().includes(termLower) ||
          item.tags.some(t => t.toLowerCase().includes(termLower))
        );
      }

      availableLetters = alphabet.filter(l => data.some(item => item.letter === l));

      renderQuickAZ();

      if (availableLetters.length > 0) {
        currentLetterIdx = 0;
        renderLetterWheel();
        updateTermListForSelectedLetter(data);
      } else {
        letterTrack.innerHTML = '';
        termTrack.innerHTML = '';
        renderHUD(null);
      }
    }

    function renderQuickAZ() {
      quickAzBar.innerHTML = '';
      alphabet.forEach(l => {
        const active = availableLetters.includes(l);
        const btn = document.createElement('button');
        btn.className = `az-btn ${active ? '' : 'disabled'}`;
        btn.innerText = l;
        if (active) {
          btn.onclick = () => {
            currentLetterIdx = availableLetters.indexOf(l);
            spinLetterWheel();
          };
        }
        quickAzBar.appendChild(btn);
      });
    }

    /* CENTER OFFSET CALCULATION */
    function getCenterOffset(idx, totalItems, containerEl) {
      const containerHeight = containerEl.clientHeight || 400;
      const centerBox = containerHeight / 2;
      return centerBox - (idx * itemHeight) - (itemHeight / 2);
    }

    function renderLetterWheel() {
      letterTrack.innerHTML = '';
      availableLetters.forEach((l, idx) => {
        const div = document.createElement('div');
        div.className = 'wheel-item';
        div.innerText = l;
        div.onclick = () => { currentLetterIdx = idx; spinLetterWheel(); };
        letterTrack.appendChild(div);
      });
      spinLetterWheel();
    }

    function spinLetterWheel() {
      const col = document.getElementById('letterWheelCol');
      const offset = getCenterOffset(currentLetterIdx, availableLetters.length, col);
      letterTrack.style.transform = `translateY(${offset}px)`;

      const items = letterTrack.querySelectorAll('.wheel-item');
      items.forEach((item, idx) => {
        const dist = Math.abs(idx - currentLetterIdx);
        item.classList.toggle('selected', idx === currentLetterIdx);
        item.style.opacity = Math.max(0.1, 1 - dist * 0.35);
        item.style.transform = `scale(${1 - dist * 0.12})`;
      });

      document.querySelectorAll('.az-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === availableLetters[currentLetterIdx]);
      });

      let data = glossaryData;
      if (currentCategory !== 'ALL') {
        data = data.filter(item => item.categories.some(c => c.startsWith(currentCategory)));
      }
      updateTermListForSelectedLetter(data);
    }

    function updateTermListForSelectedLetter(data) {
      const activeLetter = availableLetters[currentLetterIdx];
      filteredTerms = data.filter(item => item.letter === activeLetter);
      currentTermIdx = 0;

      termTrack.innerHTML = '';
      filteredTerms.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'wheel-item';
        div.innerText = item.term;
        div.onclick = () => { currentTermIdx = idx; spinTermWheel(); };
        termTrack.appendChild(div);
      });

      spinTermWheel();
    }

    function spinTermWheel() {
      const col = document.getElementById('termWheelCol');
      const offset = getCenterOffset(currentTermIdx, filteredTerms.length, col);
      termTrack.style.transform = `translateY(${offset}px)`;

      const items = termTrack.querySelectorAll('.wheel-item');
      items.forEach((item, idx) => {
        const dist = Math.abs(idx - currentTermIdx);
        item.classList.toggle('selected', idx === currentTermIdx);
        item.style.opacity = Math.max(0.1, 1 - dist * 0.35);
        item.style.transform = `scale(${1 - dist * 0.1})`;
      });

      renderHUD(filteredTerms[currentTermIdx]);
    }

    function renderHUD(item) {
      if (!item) {
        document.getElementById('hudCategory').innerText = 'N/A';
        document.getElementById('hudTitle').innerText = 'KEIN ERGEBNIS';
        document.getElementById('hudDefinition').innerText = 'Keine passenden Begriffe gefunden.';
        document.getElementById('hudExampleBox').style.display = 'none';
        document.getElementById('hudTags').innerHTML = '';
        document.getElementById('hudCrossRefs').innerHTML = '';
        return;
      }

      document.getElementById('hudCategory').innerText = item.categories.join(' // ');
      document.getElementById('hudTitle').innerText = item.term;
      document.getElementById('hudDefinition').innerText = item.definition;

      const exampleBox = document.getElementById('hudExampleBox');
      if (item.example) {
        document.getElementById('hudExample').innerText = item.example;
        exampleBox.style.display = 'block';
      } else {
        exampleBox.style.display = 'none';
      }

      document.getElementById('hudTags').innerHTML = item.tags.map(t => `<span class="tag-badge">#${t}</span>`).join(' ');

      const crossContainer = document.getElementById('hudCrossRefs');
      crossContainer.innerHTML = '';

      if (item.cross_references && item.cross_references.length > 0) {
        item.cross_references.forEach(refTerm => {
          const btn = document.createElement('button');
          btn.className = 'cross-ref-btn';
          btn.innerText = `> ${refTerm}`;
          btn.onclick = () => jumpToTerm(refTerm);
          crossContainer.appendChild(btn);
        });
      } else {
        crossContainer.innerHTML = `<span style="font-size:0.75rem; color:var(--text-muted)">KEINE</span>`;
      }
    }

    function jumpToTerm(termName) {
      const target = glossaryData.find(g => g.term.toLowerCase() === termName.toLowerCase() || g.term.toLowerCase().includes(termName.toLowerCase()));
      if (!target) return;

      const letterIdx = availableLetters.indexOf(target.letter);
      if (letterIdx !== -1) {
        currentLetterIdx = letterIdx;
        spinLetterWheel();

        const termIdx = filteredTerms.findIndex(t => t.id === target.id);
        if (termIdx !== -1) {
          currentTermIdx = termIdx;
          spinTermWheel();
        }
      }
    }

    /* ENHANCED WHEEL & TOUCH EVENT HANDLERS */
    function setupWheelEvents() {
      const letterCol = document.getElementById('letterWheelCol');
      const termCol = document.getElementById('termWheelCol');
    
      // --- 1. MAUSRAD (DESKTOP) ---
      letterCol.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY > 0 && currentLetterIdx < availableLetters.length - 1) {
          currentLetterIdx++;
          spinLetterWheel();
        } else if (e.deltaY < 0 && currentLetterIdx > 0) {
          currentLetterIdx--;
          spinLetterWheel();
        }
      }, { passive: false });
    
      termCol.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY > 0 && currentTermIdx < filteredTerms.length - 1) {
          currentTermIdx++;
          spinTermWheel();
        } else if (e.deltaY < 0 && currentTermIdx > 0) {
          currentTermIdx--;
          spinTermWheel();
        }
      }, { passive: false });
    
      // --- 2. TOUCH / SWIPE CONTROLS ---
      function attachTouchControls(element, getIndex, setIndex, getMax, spinFunc) {
        let startY = 0;
        let distY = 0;
        const threshold = 25; 

        element.addEventListener('touchstart', (e) => {
          startY = e.touches[0].clientY;
          distY = 0;
        }, { passive: true });

        element.addEventListener('touchmove', (e) => {
          if (e.cancelable) e.preventDefault();

          distY = startY - e.touches[0].clientY;

          if (Math.abs(distY) > threshold) {
            const current = getIndex();
            if (distY > 0 && current < getMax() - 1) {
              setIndex(current + 1);
              spinFunc();
              startY = e.touches[0].clientY;
            } else if (distY < 0 && current > 0) {
              setIndex(current - 1);
              spinFunc();
              startY = e.touches[0].clientY;
            }
          }
        }, { passive: false });
      }

      attachTouchControls(
        letterCol,
        () => currentLetterIdx,
        (val) => { currentLetterIdx = val; },
        () => availableLetters.length,
        spinLetterWheel
      );

      attachTouchControls(
        termCol,
        () => currentTermIdx,
        (val) => { currentTermIdx = val; },
        () => filteredTerms.length,
        spinTermWheel
      );

      // --- 3. SEARCH & RESIZE LISTENERS ---
      searchInput.addEventListener('input', (e) => {
        applyFilters(e.target.value);
      });

      window.addEventListener('resize', () => {
        if (availableLetters.length > 0) {
          spinLetterWheel();
          spinTermWheel();
        }
      });
    }

    // INITIALISIERUNG
    window.onload = initGlossaryEngine;
  </script>
</body>
</html>
