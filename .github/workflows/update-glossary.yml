name: Build Glossary Data

on:
  push:
    paths:
      - 'data/glossar.csv'
      - 'scripts/build_glossary.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Glossary Builder
        run: python scripts/build_glossary.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "auto: update glossar-data.js from CSV"
          file_pattern: 'data/glossar-data.js'
